<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comercial · Baredes Baires</title>
<!-- Se instala en el celular como app ("Agregar a la pantalla de inicio"): ícono, nombre y pantalla completa -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/comercial/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/comercial/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comercial">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:title" content="Baredes Baires Comercial">
<meta property="og:url" content="https://baredesbaires.github.io/comercial/">
<meta property="og:image" content="https://baredesbaires.github.io/comercial/icono-512.png?v=2">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="theme-color" content="#f3f4f1">
<style>
html,body{margin:0;height:100%;background:#f3f4f1}
iframe{border:0;width:100%;height:100%;display:block}
#avisos{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;box-sizing:border-box;
  background:#fff;border:1px solid #dfe2dd;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:14px 16px;
  font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;font-size:15px;color:#1d2321;line-height:1.4}
#avisos[hidden],#avisos button[hidden],#avisos p[hidden]{display:none}
#avisos b{display:block;font-family:Archivo,Arial,sans-serif;font-size:16px;margin-bottom:2px}
#avisos p{margin:0;color:#5f6864}
#avisos .bt{display:flex;gap:8px;margin-top:12px}
#avisos button{flex:1;font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:10px;cursor:pointer;border:1px solid #dfe2dd;background:#fff;color:#1e3a5f}
#avisos button.p{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
</style>
</head>
<body>
<!-- La app (Apps Script) va adentro de esta página: sin el cartel gris de Google. La sesión (6 meses) se guarda acá,
     en el celular, y se le pasa a la app. Si se entra con el botón del mail (?t=...), la app abre la sesión sola. -->
<iframe id="app" title="Comercial" allow="clipboard-write; web-share; camera; geolocation"></iframe>
<div id="avisos" hidden>
  <b id="avtit">Activar notificaciones</b>
  <p id="avtxt" hidden></p>
  <div class="bt"><button type="button" id="avno">Ahora no</button><button type="button" class="p" id="avsi">Activar</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
var BASE = "https://script.google.com/macros/s/AKfycbx-edr4XcF9oDi5JGilTMuy40aLVUfAtGWXlzPpWvG1BUfhp0JfJZz7fIkvtBT2HNi1iw/exec?app=1";
var CLAVE = "bb_comercial_sesion";
var VAPID = "BJCSl86dh0kruY4OUVx7gveUDW2ZhwbAh5SI7bNfSAmvdETLT2d0eGcfKqjY3j95dKUA_ICD9TBZEqguQeXRWv0";
var $ = function (id) { return document.getElementById(id); };
function leer(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function guardar(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
function abrir(s, t) {
  $("app").src = BASE + (s ? "&s=" + encodeURIComponent(s) : "") + (t ? "&t=" + encodeURIComponent(t) : "");
}

// ---------- Avisos (notificaciones, Firebase) ----------
// El permiso se pide desde acá (la app de adentro no puede). El código del celular se le pasa a la app,
// que lo anota a nombre de quien entró (hoja PUSH del puente).
var APP = null, ORIGEN = "", TOKEN_PUSH = "";
var ua = navigator.userAgent;
var IOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var INSTALADA = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
var PLAT = IOS ? "iPhone" : /Android/.test(ua) ? "Android" : "Compu";
var PUEDE = "serviceWorker" in navigator && "Notification" in window && "PushManager" in window;
var SW = "serviceWorker" in navigator ? navigator.serviceWorker.register("firebase-messaging-sw.js").catch(function () { return null; }) : null;
try {
  firebase.initializeApp({
    apiKey: "AIzaSyBS8gyhkNHOWTRttdne8yX_d9lyVT99IPk", authDomain: "baredes-comercial.firebaseapp.com", projectId: "baredes-comercial",
    storageBucket: "baredes-comercial.firebasestorage.app", messagingSenderId: "838138326116", appId: "1:838138326116:web:0b0c94d4dcf5f83a968371"
  });
} catch (e) { PUEDE = false; }
var RENOVADO = false;
function renovarToken() {
  if (!SW || !PUEDE) return;
  var msg = firebase.messaging();
  msg.deleteToken().catch(function () {}).then(function () { return SW; }).then(function (reg) {
    if (reg) return msg.getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
  }).then(function (tk) { if (tk) { TOKEN_PUSH = tk; pasarToken(); } }).catch(function (e) { console.log("avisos", e); });
}
function pasarToken() {
  if (APP && TOKEN_PUSH) try { APP.postMessage({ tipo: "push", token: TOKEN_PUSH, plat: PLAT }, ORIGEN); } catch (e) {}
}
function sacarToken() {
  if (!SW || !PUEDE) return;
  SW.then(function (reg) {
    if (!reg) return;
    var msg = firebase.messaging();
    // Una vez por celular se descarta el código viejo y se pide uno nuevo (el primero quedó inválido cuando
    // Android tenía bloqueadas las notificaciones de Chrome)
    var antes = leer("bb_push_renovado") === "2" ? Promise.resolve() : msg.deleteToken().catch(function () {});
    return antes.then(function () { guardar("bb_push_renovado", "2"); return msg.getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg }); }).then(function (tk) {
      if (tk) { TOKEN_PUSH = tk; pasarToken(); }
    });
  }).catch(function (e) { console.log("avisos", e); });
}
function mostrarCartel() {
  if (!leer(CLAVE) || Number(leer("bb_avisos_no")) > Date.now()) return;
  if (IOS && !INSTALADA) {
    $("avtit").textContent = "Notificaciones";
    $("avtxt").textContent = "Para recibirlas en el iPhone, instalá la app: tocá Compartir y después “Agregar a inicio”."; $("avtxt").hidden = false;
    $("avsi").hidden = true; $("avno").textContent = "Entendido";
  } else if (!(PUEDE && Notification.permission === "default")) return;
  $("avisos").hidden = false;
}
$("avno").onclick = function () { guardar("bb_avisos_no", String(Date.now() + 7 * 864e5)); $("avisos").hidden = true; };
$("avsi").onclick = function () {
  $("avisos").hidden = true;
  Notification.requestPermission().then(function (p) { if (p === "granted") sacarToken(); });
};
if (PUEDE && Notification.permission === "granted" && leer(CLAVE)) sacarToken();
// Con la app abierta Firebase no muestra la notificación sola: se muestra acá igual
if (PUEDE) try {
  firebase.messaging().onMessage(function (p) {
    var n = p.notification || {};
    SW && SW.then(function (reg) {
      if (reg) reg.showNotification(n.title || "Comercial", { body: n.body || "", badge: "/comercial/badge-96.png", icon: "/comercial/icono-192.png" });
    });
  });
} catch (e) {}
setTimeout(mostrarCartel, 2500);

window.addEventListener("message", function (e) {
  var h = "";
  try { h = new URL(e.origin).hostname; } catch (err) { return; }
  if (!/\.googleusercontent\.com$/.test(h) && h !== "script.google.com") return;
  var d = e.data || {};
  if (d.tipo === "listo") { APP = e.source; ORIGEN = e.origin; pasarToken(); }
  // El código que tenía guardado el celular ya no sirve: se descarta y se pide uno nuevo (una vez por apertura)
  if (d.tipo === "renovarPush" && !RENOVADO) { RENOVADO = true; renovarToken(); }
  if (d.tipo === "sesion" && d.token) { guardar(CLAVE, d.token); abrir(d.token); setTimeout(mostrarCartel, 4000); }
  if (d.tipo === "salir") { guardar(CLAVE, ""); abrir(""); }
});
var t = new URLSearchParams(location.search).get("t");
if (t) history.replaceState(null, "", location.pathname);
abrir(t ? "" : leer(CLAVE), t);
</script>
</body>
</html>
