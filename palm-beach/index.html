<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería Palm Beach</title>
<!-- Ícono y nombre al anclar la página a la pantalla de inicio del celular -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/palm-beach/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/palm-beach/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Palm Beach">
<!-- Vista previa al compartir el link (WhatsApp, etc.): ícono grande para que no se vea pixelado -->
<meta property="og:type" content="website">
<meta property="og:title" content="Galería Palm Beach">
<meta property="og:url" content="https://baredesbaires.github.io/palm-beach/">
<meta property="og:image" content="https://baredesbaires.github.io/palm-beach/icono-512.png?v=2">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="theme-color" content="#18233a">
<style>html,body{margin:0;height:100%;background:#f3f4f7}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<!-- Muestra el reporte (Apps Script) dentro de esta página: así no aparece el cartel gris de Google.
     Si se entra desde el botón del mail (?t=...), se lo pasa al reporte para entrar sin código. -->
<iframe id="r" title="Reporte de Galería Palm Beach" allow="clipboard-write"></iframe>
<script>
var base = "https://script.google.com/macros/s/AKfycbwy3TPXI9hCuFiBh6gpDzQN_sHketjbJRVwFYjMiCF8S-HHv-QMxAmhF2wFc_-VNwaQ/exec?g=palm-beach";
var t = new URLSearchParams(location.search).get("t");
document.getElementById("r").src = base + (t ? "&t=" + encodeURIComponent(t) : "");
if (t) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
