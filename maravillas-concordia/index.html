<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería Maravillas Concordia</title>
<style>html,body{margin:0;height:100%;background:#f3f4f7}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<!-- Muestra el reporte (Apps Script) dentro de esta página: así no aparece el cartel gris de Google.
     Si se entra desde el botón del mail (?t=...), se lo pasa al reporte para entrar sin código. -->
<iframe id="r" title="Reporte de Galería Maravillas Concordia" allow="clipboard-write"></iframe>
<script>
var base = "https://script.google.com/macros/s/AKfycbwy3TPXI9hCuFiBh6gpDzQN_sHketjbJRVwFYjMiCF8S-HHv-QMxAmhF2wFc_-VNwaQ/exec?g=maravillas-concordia";
var t = new URLSearchParams(location.search).get("t");
document.getElementById("r").src = base + (t ? "&t=" + encodeURIComponent(t) : "");
if (t) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
